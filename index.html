<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Habit Intelligence Life OS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.76.0/build/stlite.js";
      mount({
        requirements: ["pandas", "numpy", "scikit-learn", "matplotlib"],
        entrypoint: "app.py",
        files: {
          "app.py": {
            url: "https://raw.githubusercontent.com/IamMosiow/habit-intelligence-engine/main/app.py"
          }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
